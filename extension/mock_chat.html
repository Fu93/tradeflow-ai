<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>TradeFlow AI — 1688 / 阿里巴巴 模擬談判測試沙盒</title>
  <style>
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 520px;
      height: 680px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .chat-header {
      background: #0f172a;
      padding: 14px 18px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .supplier-name {
      font-weight: 700;
      color: #38bdf8;
      font-size: 14px;
    }
    .supplier-status {
      font-size: 12px;
      color: #10b981;
    }
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #111827;
    }
    .msg-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }
    .msg-received {
      background: #1e293b;
      color: #f8fafc;
      align-self: flex-start;
      border: 1px solid #334155;
    }
    .msg-sent {
      background: #0284c7;
      color: #ffffff;
      align-self: flex-end;
    }
    .chat-input-area {
      padding: 14px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      resize: none;
      height: 40px;
      outline: none;
    }
    textarea:focus {
      border-color: #38bdf8;
    }
    button.send-btn {
      background: #0284c7;
      border: none;
      color: #fff;
      padding: 0 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    button.sim-btn {
      background: #334155;
      border: 1px solid #475569;
      color: #f1f5f9;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-left: 6px;
    }
    button.sim-btn:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div>
        <div class="supplier-name">浙江頂尖雨具製造實業有限公司 (1688 認證金牌廠商)</div>
        <div class="supplier-status">● 線上洽談中 (MOQ 10,000 件)</div>
      </div>
      <div>
        <button class="sim-btn" id="btn-sim-quote">模擬報價 ¥14.80</button>
      </div>
    </div>

    <!-- Chat Messages Viewport -->
    <div class="chat-messages" id="messages-box">
      <div class="msg-bubble msg-received">
        您好！歡迎詢盤定制碳纖維全自動雨傘。本批次 MOQ 10,000 件。初次配合給您的單價報價為 <strong>¥15.60</strong> / 件，支持定制印刷 LOGO。
      </div>
    </div>

    <!-- Chat Input Area -->
    <div class="chat-input-area">
      <textarea id="chatInput" placeholder="輸入談判訊息..."></textarea>
      <button class="send-btn" id="sendBtn">發送</button>
    </div>
  </div>

  <script>
    const box = document.getElementById("messages-box");
    const input = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const simBtn = document.getElementById("btn-sim-quote");

    let quoteSequence = [14.80, 14.10, 13.50, 13.00, 12.60];
    let quoteIdx = 0;

    sendBtn.addEventListener("click", () => {
      const text = input.value.trim();
      if (!text) return;
      const b = document.createElement("div");
      b.className = "msg-bubble msg-sent";
      b.innerText = text;
      box.appendChild(b);
      input.value = "";
      box.scrollTop = box.scrollHeight;
    });

    simBtn.addEventListener("click", () => {
      const q = quoteSequence[Math.min(quoteIdx++, quoteSequence.length - 1)];
      const b = document.createElement("div");
      b.className = "msg-bubble msg-received";
      b.innerHTML = `老闆您好，經我們工廠核算原材料成本，最新讓步報價單價為 <strong>¥${q.toFixed(2)}</strong> 元/件，請審閱。`;
      box.appendChild(b);
      box.scrollTop = box.scrollHeight;
      simBtn.innerText = `模擬報價 ¥${(q - 0.5 > 12.0 ? q - 0.5 : 12.2).toFixed(2)}`;
    });
  </script>
</body>
</html>
