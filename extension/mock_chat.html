<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- inline favicon：避免瀏覽器自動探測 /favicon.ico 產生 404，讓 demo 時 Console 乾淨 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⚡</text></svg>">
  <title>TradeFlow AI — 1688 / 阿里巴巴 模擬談判測試沙盒</title>
  <style>
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 520px;
      height: 680px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .chat-header {
      background: #0f172a;
      padding: 14px 18px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .supplier-name {
      font-weight: 700;
      color: #38bdf8;
      font-size: 14px;
    }
    .supplier-status {
      font-size: 12px;
      color: #10b981;
    }
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #111827;
    }
    .msg-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }
    .msg-received {
      background: #1e293b;
      color: #f8fafc;
      align-self: flex-start;
      border: 1px solid #334155;
    }
    .msg-sent {
      background: #0284c7;
      color: #ffffff;
      align-self: flex-end;
    }
    .chat-input-area {
      padding: 14px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      resize: none;
      height: 40px;
      outline: none;
    }
    textarea:focus {
      border-color: #38bdf8;
    }
    button.send-btn {
      background: #0284c7;
      border: none;
      color: #fff;
      padding: 0 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    button.sim-btn {
      background: #334155;
      border: 1px solid #475569;
      color: #f1f5f9;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      margin-left: 6px;
    }
    button.sim-btn:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div style="background:#b45309; color:#fff; font-size:11px; padding:5px 12px; text-align:center;">
      模擬測試資料（非真實供應商 / 非真實報價）— Mock Sandbox，僅供擴充元件開發測試
    </div>
    <div class="chat-header">
      <div>
        <div class="supplier-name">浙江頂尖雨具製造實業有限公司 (1688 認證金牌廠商) —【假設性測試對象】</div>
        <div class="supplier-status">● 線上洽談中 (MOQ 10,000 件)</div>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <button class="sim-btn" id="btn-sim-quote">模擬常規降價</button>
        <button class="sim-btn" id="btn-sim-stagnant" style="background: #0284c7; border-color: #38bdf8;">模擬單價寸步不讓 (觸發多維置換)</button>
        <button class="sim-btn" id="btn-sim-captcha" style="background: #e11d48; border-color: #f43f5e;">模擬阿里風控滑塊 (合規門禁)</button>
      </div>
    </div>

    <!-- Chat Messages Viewport -->
    <div class="chat-messages" id="messages-box">
      <div class="msg-bubble msg-received">
        您好！歡迎詢盤定制碳纖維全自動雨傘。本批次 MOQ 10,000 件。初次配合給您的單價報價為 <strong>¥15.60</strong> / 件，支持定制印刷 LOGO。
      </div>
    </div>

    <!-- Simulated Alibaba Baxia / No-Captcha Modal Overlay -->
    <div id="baxia-dialog-content" style="
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1e293b;
      border: 2px solid #f43f5e;
      border-radius: 8px;
      padding: 20px;
      z-index: 10000;
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.4);
      text-align: center;
      width: 340px;
    ">
      <div style="color: #f43f5e; font-weight: 700; margin-bottom: 8px; font-size: 14px;">[1688 安全驗證中心]</div>
      <div style="font-size: 12px; color: #94a3b8; margin-bottom: 16px;">檢測到環境異常，請向右滑動滑塊以完成驗證</div>
      <div id="nc_1_n1z" style="
        background: #0f172a;
        border: 1px solid #475569;
        height: 38px;
        border-radius: 4px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #64748b;
        cursor: pointer;
      ">
        點擊此處完成人工驗證滑動
      </div>
    </div>

    <!-- Chat Input Area -->
    <div class="chat-input-area">
      <textarea id="chatInput" placeholder="輸入談判訊息..."></textarea>
      <button class="send-btn" id="sendBtn">發送</button>
    </div>
  </div>

  <script>
    const box = document.getElementById("messages-box");
    const input = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const simBtn = document.getElementById("btn-sim-quote");

    const captchaModal = document.getElementById("baxia-dialog-content");
    const captchaBtn = document.getElementById("btn-sim-captcha");
    const sliderBox = document.getElementById("nc_1_n1z");

    const simStagnantBtn = document.getElementById("btn-sim-stagnant");

    // [誠實揭露] 這是模擬沙盒的**刻意測試資料**：本頁不呼叫任何後端，quoteSequence
    // 用來在測試中回放一組降價報價，驗證擴充的偵測/決策卡流程。它不是即時市場報價，
    // 也不代表任何真實供應商的出價（頁首已標示「非真實供應商 / 非真實報價」）。
    let quoteSequence = [14.80, 14.10, 13.50, 13.00, 12.60];
    let quoteIdx = 0;

    simStagnantBtn.addEventListener("click", () => {
      const b = document.createElement("div");
      b.className = "msg-bubble msg-received";
      b.innerHTML = `老闆，這款防風全自動傘單價 <strong>¥14.50</strong> 已經是我們產線最低極限了，真的一毛都不能再降，再降我們廠直接賠錢做。`;
      box.appendChild(b);
      box.scrollTop = box.scrollHeight;
    });

    captchaBtn.addEventListener("click", () => {
      captchaModal.style.display = "block";
    });

    sliderBox.addEventListener("click", () => {
      // 模擬人類滑動成功
      sliderBox.innerText = "[驗證通過] 真人滑動成功";
      sliderBox.style.background = "#065f46";
      sliderBox.style.color = "#34d399";
      setTimeout(() => {
        captchaModal.style.display = "none";
        sliderBox.innerText = "點擊此處完成人工驗證滑動";
        sliderBox.style.background = "#0f172a";
        sliderBox.style.color = "#64748b";
      }, 700);
    });

    sendBtn.addEventListener("click", () => {
      const text = input.value.trim();
      if (!text) return;
      const b = document.createElement("div");
      b.className = "msg-bubble msg-sent";
      b.innerText = text;
      box.appendChild(b);
      input.value = "";
      box.scrollTop = box.scrollHeight;
    });

    simBtn.addEventListener("click", () => {
      const q = quoteSequence[Math.min(quoteIdx++, quoteSequence.length - 1)];
      const b = document.createElement("div");
      b.className = "msg-bubble msg-received";
      b.innerHTML = `老闆您好，經我們工廠核算原材料成本，最新讓步報價單價為 <strong>¥${q.toFixed(2)}</strong> 元/件，請審閱。`;
      box.appendChild(b);
      box.scrollTop = box.scrollHeight;
      simBtn.innerText = `模擬報價 ¥${(q - 0.5 > 12.0 ? q - 0.5 : 12.2).toFixed(2)}`;
    });
  </script>
</body>
</html>
