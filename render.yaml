# Live service tradeflow-ai-demo (Frankfurt, Docker, 0.5 CPU / 512 MB).
# https://tradeflow-ai-demo.onrender.com
# Apply from the Render Blueprint screen. The service name matches the live service.
# PORT is injected by Render; the process binds 0.0.0.0:$PORT. Do not set PORT here.
# Do not set a dockerCommand. The image CMD is the only server process.
# WEB_CONCURRENCY is 1. A second command, or a higher value, binds port 10000 twice.
services:
  - type: web
    name: tradeflow-ai-demo
    runtime: docker
    plan: starter
    region: frankfurt
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      # Production fail-closed webhooks. Sandbox fail-open is not used on this service.
      - key: TRADEFLOW_ENV
        value: production
      # "0" leaves /negotiate and src/legacy unmounted. "1" is the legacy switch.
      - key: TRADEFLOW_LEGACY
        value: "0"
      # File path or http(s) URL. Unset or blank: verify reports "anchor not configured".
      - key: TRADEFLOW_CHAIN_ANCHOR
        sync: false
      # SQLite path. Blank uses the default under the ephemeral disk.
      - key: TRADEFLOW_DESK_DB
        sync: false
      # Retired chain keys, comma-separated id:secret. Blank until a rotation.
      - key: TRADEFLOW_CHAIN_KEYS
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TRADEFLOW_SOLVER_BACKEND
        value: numpy
      - key: VLLM_API_KEY
        sync: false
      # Nebius Token Factory key for the Nemotron quote reader (the base URL and
      # models default in src/config/heuristics.py). Unset leaves the rule reader only.
      - key: TRADEFLOW_LLM_API_KEY
        sync: false
      # Paid Token Factory calls per UTC day (default 40 in heuristics; 0 = off).
      - key: TRADEFLOW_LLM_DAILY_CALLS
        value: "40"
      # Optional third extractor hop on NVIDIA's hosted endpoint. Opens only after Nebius fails.
      - key: NVIDIA_API_KEY
        sync: false
      # Tavily Search API key for the Web evidence card. Unset: the card says it is not configured.
      - key: TAVILY_API_KEY
        sync: false
      - key: EVOLUS_API_KEY
        sync: false
      - key: EVOLUS_APP_ID
        sync: false
      - key: TRADEFLOW_API_KEY
        sync: false
      - key: TRADEFLOW_CHAIN_KEY
        sync: false
      - key: TRADEFLOW_CHAIN_KEY_ID
        sync: false
      - key: TRADEFLOW_WEBHOOK_TOKEN
        sync: false
      # Whether a send needs an Ed25519-signed approval. This service runs
      # TRADEFLOW_ENV=production, which requires one unless this says otherwise.
      # The public judging demo sets it to 0: a browser cannot sign, mail
      # sending is off (no SMTP), so an approval there records "approved, not
      # transmitted". A real deployment leaves it unset (or 1) and pins a key.
      - key: TRADEFLOW_REQUIRE_SIGNED_APPROVAL
        sync: false
      # Ed25519 public key of the human approver (64 hex chars). With signed
      # approval required and no key pinned, every desk send is refused rather
      # than accepted on an unsigned boolean (/ready reports it). Generate the
      # pair on the approver's own machine with
      #   python -m src.desk.approval_signing keygen --out approval_keypair.json
      # and copy only "public_key" into this variable. Never paste the private
      # half into a hosting dashboard.
      - key: TRADEFLOW_APPROVAL_PUBKEY
        sync: false
      - key: DESK_N_SAMPLES
        value: "5000"
      - key: DESK_N_GRID
        value: "20"
      - key: IMAP_SSL
        value: "1"
      - key: IMAP_LOOKBACK_DAYS
        value: "14"
