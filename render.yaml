# Live service tradeflow-ai-demo (Frankfurt, Docker, 0.5 CPU / 512 MB).
# https://tradeflow-ai-demo.onrender.com
# Apply from the Render Blueprint screen. The service name matches the live service.
# PORT is injected by Render; the process binds 0.0.0.0:$PORT. Do not set PORT here.
# Do not set a dockerCommand. The image CMD is the only server process.
# WEB_CONCURRENCY is 1. A second command, or a higher value, binds port 10000 twice.
services:
  - type: web
    name: tradeflow-ai-demo
    runtime: docker
    plan: starter
    region: frankfurt
    branch: master
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Sandbox is the auction demo. Desk reads and sends need the secrets below.
      - key: TRADEFLOW_ENV
        value: sandbox
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TRADEFLOW_SOLVER_BACKEND
        value: numpy
      - key: VLLM_BASE_URL
        value: https://developer.amd.com.cn/radeon/api/v1
      - key: VLLM_MODEL
        value: Gemma-4-31B-IT
      - key: VLLM_API_KEY
        sync: false
      - key: EVOLUS_API_KEY
        sync: false
      - key: EVOLUS_APP_ID
        sync: false
      - key: TRADEFLOW_API_KEY
        sync: false
      - key: TRADEFLOW_CHAIN_KEY
        sync: false
      - key: TRADEFLOW_CHAIN_KEY_ID
        sync: false
      - key: TRADEFLOW_WEBHOOK_TOKEN
        sync: false
      - key: DESK_N_SAMPLES
        value: "5000"
      - key: DESK_N_GRID
        value: "20"
      - key: IMAP_SSL
        value: "1"
      - key: IMAP_LOOKBACK_DAYS
        value: "14"
