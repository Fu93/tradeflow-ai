services:
  tradeflow:
    restart: unless-stopped
    build:
      context: .
      # [OPS 2026-10-25] Stamp the build identity read by GET /version:
      #   GIT_SHA=$(git rev-parse --short HEAD) docker compose up --build
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "8000:8000"
    # [OPS 2026-10-24] SQLite persistence. Without this volume a container
    # rebuild throws the desk database, the session store, and with them the
    # audit chain away. The desk DB path is pinned into the volume so the
    # backup drill (scripts/backup_desk_db.py) has one canonical location.
    volumes:
      - desk-data:/app/data
    # Optional. A checkout with no .env still starts: the process defaults
    # to TRADEFLOW_ENV=sandbox and TRADEFLOW_SOLVER_BACKEND=numpy.
    # `environment` below overrides env_file, so only PORT is forced.
    env_file:
      - path: .env
        required: false
    environment:
      # The published port is 8000. The process also honours PORT.
      PORT: "8000"
      # Inside the mounted volume above: survives rebuilds, not host-erased.
      TRADEFLOW_DESK_DB: /app/data/desk.db
    # The decision engine runs in this container on NumPy unless the image
    # actually has CuPy/ROCm and TRADEFLOW_SOLVER_BACKEND=cupy. This compose
    # file does not attach a GPU and does not run the solver on MI300X.
    # The only MI300X figure in the repo is a theoretical roofline lower-bound
    # estimate, not measured (results/mi300x_roofline.json). No MI300X run
    # is produced here.
    # An AMD tokenfactory / vLLM endpoint, if configured in .env, is remote.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; p=os.environ.get('PORT','8000'); urllib.request.urlopen('http://127.0.0.1:'+p+'/health', timeout=4).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    command: python -m src.app.main

# The named volume survives container rebuilds and image upgrades on this
# host. It does NOT survive `docker compose down -v`, and it is not a backup:
# run scripts/backup_desk_db.py on a schedule (see docs/deploy.md).
volumes:
  desk-data:
