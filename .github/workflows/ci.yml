name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # [FAIL-CLOSED] A workflow GitHub refuses to validate produces a run with
      # ZERO jobs and conclusion=failure, so no step in this file can report it —
      # that is exactly how `if: ${{ secrets.X != '' }}` silently disabled CI on
      # two pushes. actionlint enforces GitHub's own expression/context rules.
      - name: Lint workflow files
        run: |
          python -m pip install --quiet actionlint-py
          actionlint .github/workflows/*.yml

      # Phase-1 modules, the app-layer modules from the main.py split, and
      # main.py itself. src/legacy is gated separately on F,E9 (see below):
      # the frozen v1 surface is linted for real defects, not style.
      # [ARCHITECTURE 2026-10-24] The shims (src/engine/*, src/session/*)
      # carry .pyi stubs re-exporting the real src.legacy surface, which is
      # what makes mypy's static names resolve; mypy's file list lives in
      # pyproject.toml and now covers the new app-layer modules too.
      - name: Ruff phase-1 modules
        run: >
          python -m ruff check src/desk src/engine/decision.py src/engine/reserve.py
          src/engine/hazard_fit.py src/app/main.py src/app/state.py src/app/routes_meta.py
          src/app/routes_negotiate.py src/app/routes_command.py
          src/app/routes_sessions.py src/app/routes_round.py
          src/app/routes_analysis.py src/app/routes_auction.py

      - name: Ruff frozen legacy surface (F, E9)
        run: python -m ruff check src/legacy --select F,E9

      - name: Mypy phase-1 and app-layer modules
        run: python -m mypy

      # tests/test_dashboard_prior_chart.py renders the real dashboard in
      # Chromium. Without the binary those 3 assertions fail with "Executable
      # doesn't exist" — CI has to install the browser, not skip the tests.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # Previously this job ran only 4 test files directly (test_engine,
      # test_evolus, test_benchmark, test_api), so 97 of 101 tests never ran in
      # CI and a regression anywhere else could not be detected.
      # The 90% gate is the phase-1 path: the desk plus the one offer, the
      # reserve, and the hazard fit. Legacy engines stay out of this percentage.
      - name: Run full test suite
        run: >
          python -m pytest tests -q
          --cov=src.desk
          --cov=src.engine.decision
          --cov=src.engine.reserve
          --cov=src.engine.hazard_fit
          --cov=src.engine.bilingual
          --cov-fail-under=90

      # The jury-facing one-command health suite. On 2026-10-20 the v2 phase-1
      # refactor broke verify_all pillar 2 (frozen reserves were applied to a
      # caller-named supplier list) while the pytest suite stayed green, because
      # pytest never exercised that combination and CI never ran verify_all.
      # A green suite plus a red jury suite is exactly the "tests green, first
      # reviewer step dies" failure mode this project already paid for once on
      # submission day, so verify_all now runs as a named CI step.
      - name: Crash and recovery drill (disposable database, no external calls)
        run: python scripts/audit_runtime_reliability.py --output /tmp/tradeflow-runtime-faults.json

      - name: Concurrent HTTP and hard restart drill (independent invoice oracle)
        run: python scripts/audit_runtime_load.py --output /tmp/tradeflow-runtime-load.json

      - name: Independent Decimal invoice boundaries
        run: |
          python scripts/audit_financial_boundaries.py --cases 10000 --output /tmp/tradeflow-runtime-financial-boundaries.json
          python scripts/audit_financial_boundaries.py --cases 10000 --just-below-cent --output /tmp/tradeflow-runtime-financial-below-boundaries.json
          python scripts/audit_financial_boundaries.py --cases 10000 --perturb-inputs --output /tmp/tradeflow-runtime-financial-precise-inputs.json
          python scripts/audit_financial_boundaries.py --cases 10000 --just-below-cent --perturb-inputs --output /tmp/tradeflow-runtime-financial-below-precise-inputs.json

      - name: Upload runtime reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-reliability-evidence
          path: /tmp/tradeflow-runtime-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Run verify_all jury health suite
        run: python verify_all.py

      - name: Mutation sanity for the decision path
        run: python scripts/mutation_sanity.py

      - name: Audit runtime dependencies
        run: python -m pip_audit --requirement requirements.lock --disable-pip --strict

      # No API key in CI. The script must exit 0 and record a skip, not a pass
      # that pretends the AMD endpoint was checked.
      - name: AMD endpoint probe skips without a key
        run: python scripts/verify_amd_endpoint.py --evidence /tmp/amd_endpoint_evidence.json

      # Gate on the honesty checks this project relies on.
      #
      # No .env in CI. The scanner still reads tracked files and fails on
      # private-key and token patterns. It says credential values were not
      # compared. --allow-missing-env keeps that pattern scan; it is not a
      # skip. The optional step below adds real needles when secrets exist.
      - name: Scan for committed credentials (no .env in CI)
        run: python scripts/secret_scan.py --allow-missing-env

      # Optional strengthening: when the CI environment provides the real
      # credential values as secrets, write them to a throwaway .env so the scan
      # becomes a genuine leak check instead of a no-op.
      #
      # [FAIL-CLOSED] This step must NOT be guarded by
      # `if: ${{ secrets.X != '' }}`: the `secrets` context is not available in
      # step-level `if:` expressions, so GitHub rejected the whole workflow at
      # validation time (run created, zero jobs, conclusion failure) and the
      # entire CI pipeline never executed. The guard now happens inside the
      # script: with no secrets the step prints an explicit skip, with secrets
      # it performs the real scan.
      - name: Scan for committed credentials using configured secrets
        env:
          CI_EVOLUS_API_KEY: ${{ secrets.EVOLUS_API_KEY }}
          CI_EVOLUS_APP_ID: ${{ secrets.EVOLUS_APP_ID }}
          CI_VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          keys = {
              "EVOLUS_API_KEY": os.environ.get("CI_EVOLUS_API_KEY", ""),
              "EVOLUS_APP_ID": os.environ.get("CI_EVOLUS_APP_ID", ""),
              "VLLM_API_KEY": os.environ.get("CI_VLLM_API_KEY", ""),
          }
          present = {k: v for k, v in keys.items() if v}
          if not present:
              print("SKIP: no credential secrets configured in this repository;")
              print("      this was NOT a leak check. Configure EVOLUS_API_KEY /")
              print("      EVOLUS_APP_ID / VLLM_API_KEY to enable the real scan.")
              sys.exit(0)
          with open(".env", "w", encoding="utf-8") as fh:
              for k, v in present.items():
                  fh.write(f"{k}={v}\n")
          print("wrote .env with", len(present), "credential(s)")
          PY
          if [ -f .env ]; then python scripts/secret_scan.py; rm -f .env; fi

      - name: Verify documentation links resolve
        run: python scripts/check_doc_links.py

      - name: Check documented numbers against source files
        run: python scripts/check_claims.py

      - name: Check the MI300X roofline still matches the formula
        run: python scripts/regen_mi300x_roofline.py --check

      - name: Reject undeclared scenario numbers outside the simulator
        run: python scripts/check_no_fake_literals.py

      - name: Reject unregistered decision literals
        run: python scripts/check_decision_literals.py

      # Run the guard tests explicitly so a regression in a security/integrity
      # gate is visible as a named CI step rather than buried in the suite.
      - name: Run security and integrity guard tests
        run: |
          python -m pytest tests/test_api_security.py tests/test_secret_scan.py \
                           tests/test_benchmark_integrity.py tests/test_web_xss.py -q

      # One named test per defect found in the 2026-10-17 audit, so a regression
      # in any of them shows up as a failed step instead of hiding inside the
      # suite: zero-evidence rounds, /approve using the engine's price instead of
      # the target, approvals inventing a 0% breakdown risk, unsynchronised
      # savings baselines, silent Stage-2 failures, unearned competing quotes,
      # and the copilot generated reply vanishing on reload.
      - name: Run 2026-10-17 audit regression tests
        run: python -m pytest tests/test_audit_2026_10_17_fixes.py -q

  # The extension had never been executed in CI: tests/test_extension_e2e.py
  # imported playwright at module scope, so `pytest tests` died with a
  # collection error (exit 2) and ZERO tests ran on the first push after the
  # workflow itself was fixed. The suite now collects without a browser, and
  # this job runs the real thing — unpacked MV3 extension in headed Chromium
  # (xvfb), driving the actual backend and mock supplier page.
  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Extension end-to-end (real Chromium, headed via xvfb)
        run: xvfb-run -a python tests/test_extension_e2e.py

  container-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked caller dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Seed disposable build-context state canaries
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("data/desk.db", "data/desk.db-wal", "data/nested/desk.sqlite3", "data/nested/approval_keypair-canary.json"):
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              with path.open("xb") as stream:
                  stream.write(b"Synthetic runtime-state canary; must never be baked into an image")
          PY
      - name: Build actual production image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t tradeflow-ci .
      - name: Resource limits, signed approval and container recreation
        run: >
          python scripts/audit_container_runtime.py --image tradeflow-ci
          --expected-sha ${{ github.sha }} --output /tmp/container-acceptance.json
      - name: Upload container acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: container-acceptance-evidence
          path: /tmp/container-acceptance.json
          if-no-files-found: error
          retention-days: 14
