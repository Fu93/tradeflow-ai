name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # [FAIL-CLOSED] A workflow GitHub refuses to validate produces a run with
      # ZERO jobs and conclusion=failure, so no step in this file can report it —
      # that is exactly how `if: ${{ secrets.X != '' }}` silently disabled CI on
      # two pushes. actionlint enforces GitHub's own expression/context rules.
      - name: Lint workflow files
        run: |
          python -m pip install --quiet actionlint-py
          actionlint .github/workflows/*.yml

      # tests/test_dashboard_prior_chart.py renders the real dashboard in
      # Chromium. Without the binary those 3 assertions fail with "Executable
      # doesn't exist" — CI has to install the browser, not skip the tests.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # Previously this job ran only 4 test files directly (test_engine,
      # test_evolus, test_benchmark, test_api), so 97 of 101 tests never ran in
      # CI and a regression anywhere else could not be detected.
      - name: Run full test suite
        run: python -m pytest tests -q

      # No API key in CI. The script must exit 0 and record a skip, not a pass
      # that pretends the AMD endpoint was checked.
      - name: AMD endpoint probe skips without a key
        run: python scripts/verify_amd_endpoint.py --evidence /tmp/amd_endpoint_evidence.json

      # Gate on the honesty checks this project relies on.
      #
      # [FAIL-CLOSED] secret_scan.py reads the credential VALUES from .env and
      # greps the tree for them. A CI runner has no .env, so before this fix it
      # scanned for zero credentials and printed "[PASS] No credential value
      # found" unconditionally — the gate could never fail.
      #
      # CI has no .env, so the scanner is now invoked with
      # --allow-missing-env, which makes it print an explicit
      # "NOT a security verification" warning and never claim a PASS it did not
      # earn. To make this gate meaningful in CI, populate the credential values
      # from repository secrets first; see the optional step below.
      - name: Scan for committed credentials (no .env in CI)
        run: python scripts/secret_scan.py --allow-missing-env

      # Optional strengthening: when the CI environment provides the real
      # credential values as secrets, write them to a throwaway .env so the scan
      # becomes a genuine leak check instead of a no-op.
      #
      # [FAIL-CLOSED] This step must NOT be guarded by
      # `if: ${{ secrets.X != '' }}`: the `secrets` context is not available in
      # step-level `if:` expressions, so GitHub rejected the whole workflow at
      # validation time (run created, zero jobs, conclusion failure) and the
      # entire CI pipeline never executed. The guard now happens inside the
      # script: with no secrets the step prints an explicit skip, with secrets
      # it performs the real scan.
      - name: Scan for committed credentials using configured secrets
        env:
          CI_EVOLUS_API_KEY: ${{ secrets.EVOLUS_API_KEY }}
          CI_EVOLUS_APP_ID: ${{ secrets.EVOLUS_APP_ID }}
          CI_VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          keys = {
              "EVOLUS_API_KEY": os.environ.get("CI_EVOLUS_API_KEY", ""),
              "EVOLUS_APP_ID": os.environ.get("CI_EVOLUS_APP_ID", ""),
              "VLLM_API_KEY": os.environ.get("CI_VLLM_API_KEY", ""),
          }
          present = {k: v for k, v in keys.items() if v}
          if not present:
              print("SKIP: no credential secrets configured in this repository;")
              print("      this was NOT a leak check. Configure EVOLUS_API_KEY /")
              print("      EVOLUS_APP_ID / VLLM_API_KEY to enable the real scan.")
              sys.exit(0)
          with open(".env", "w", encoding="utf-8") as fh:
              for k, v in present.items():
                  fh.write(f"{k}={v}\n")
          print("wrote .env with", len(present), "credential(s)")
          PY
          if [ -f .env ]; then python scripts/secret_scan.py; rm -f .env; fi

      - name: Verify documentation links resolve
        run: python scripts/check_doc_links.py

      - name: Check documented numbers against source files
        run: python scripts/check_claims.py

      - name: Reject undeclared scenario numbers outside the simulator
        run: python scripts/check_no_fake_literals.py

      # Run the guard tests explicitly so a regression in a security/integrity
      # gate is visible as a named CI step rather than buried in the suite.
      - name: Run security and integrity guard tests
        run: |
          python -m pytest tests/test_api_security.py tests/test_secret_scan.py \
                           tests/test_benchmark_integrity.py tests/test_web_xss.py -q

      # One named test per defect found in the 2026-10-17 audit, so a regression
      # in any of them shows up as a failed step instead of hiding inside the
      # suite: zero-evidence rounds, /approve using the engine's price instead of
      # the target, approvals inventing a 0% breakdown risk, unsynchronised
      # savings baselines, silent Stage-2 failures, unearned competing quotes,
      # and the copilot generated reply vanishing on reload.
      - name: Run 2026-10-17 audit regression tests
        run: python -m pytest tests/test_audit_2026_10_17_fixes.py -q

  # The extension had never been executed in CI: tests/test_extension_e2e.py
  # imported playwright at module scope, so `pytest tests` died with a
  # collection error (exit 2) and ZERO tests ran on the first push after the
  # workflow itself was fixed. The suite now collects without a browser, and
  # this job runs the real thing — unpacked MV3 extension in headed Chromium
  # (xvfb), driving the actual backend and mock supplier page.
  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Extension end-to-end (real Chromium, headed via xvfb)
        run: xvfb-run -a python tests/test_extension_e2e.py
